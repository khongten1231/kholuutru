<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chúc mừng 20/10 🌷</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle, #24112f, #090613 75%);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin-top: 35px;
  color: #ff83c8;
  font-size: clamp(25px, 6vw, 42px);
  text-shadow: 0 0 15px #ff36a6;
  animation: glow 2s infinite alternate;
}

.subtitle {
  margin-top: 12px;
  color: #ffe1f3;
  font-size: 17px;
}

.garden {
  position: relative;
  height: 340px;
  width: 300px;
  margin: 25px auto 0;
}

.flower {
  position: absolute;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  height: 250px;
  width: 180px;
}

.stem {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 6px;
  height: 0;
  background: linear-gradient(#6de58a, #168c52);
  border-radius: 10px;
  transform: translateX(-50%);
  animation: grow 2s ease-out forwards;
}

.leaf {
  position: absolute;
  width: 45px;
  height: 22px;
  background: #43cf78;
  border-radius: 100% 0 100% 0;
  opacity: 0;
  animation: leafIn 1s 1.7s forwards;
}

.leaf.left {
  bottom: 75px;
  left: 48px;
  transform: rotate(15deg);
}

.leaf.right {
  bottom: 110px;
  right: 45px;
  transform: rotate(75deg) scaleX(-1);
  animation-delay: 2s;
}

.bloom {
  position: absolute;
  top: 0;
  left: 50%;
  width: 130px;
  height: 130px;
  transform: translateX(-50%) scale(0);
  animation: bloom 1.5s 2s cubic-bezier(.2,1.5,.5,1) forwards;
}

.petal {
  position: absolute;
  width: 43px;
  height: 62px;
  left: 43px;
  top: 5px;
  transform-origin: 22px 60px;
  background: linear-gradient(135deg, #fff0fa, #ff62b4 75%);
  border-radius: 50% 50% 35% 35%;
  box-shadow: 0 0 12px #ff65ba;
}

.petal:nth-child(1) { transform: rotate(0deg); }
.petal:nth-child(2) { transform: rotate(45deg); }
.petal:nth-child(3) { transform: rotate(90deg); }
.petal:nth-child(4) { transform: rotate(135deg); }
.petal:nth-child(5) { transform: rotate(180deg); }
.petal:nth-child(6) { transform: rotate(225deg); }
.petal:nth-child(7) { transform: rotate(270deg); }
.petal:nth-child(8) { transform: rotate(315deg); }

.center {
  position: absolute;
  width: 38px;
  height: 38px;
  top: 49px;
  left: 46px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff8a6, #ffb52e);
  box-shadow: 0 0 20px #ffd54f;
}

.message {
  position: relative;
  z-index: 2;
  margin: -5px auto 0;
  padding: 0 20px;
  max-width: 500px;
  opacity: 0;
  animation: appear 1.5s 3.5s forwards;
}

.message h2 {
  color: #ff9ad5;
  font-size: 25px;
  margin-bottom: 12px;
}

.message p {
  line-height: 1.8;
  color: #ffe8f5;
  font-size: 16px;
}

button {
  margin-top: 18px;
  padding: 12px 25px;
  border: 1px solid #ff8dcf;
  border-radius: 30px;
  background: linear-gradient(45deg, #ff399e, #a644ff);
  color: white;font-size: 16px;
  cursor: pointer;
  box-shadow: 0 0 20px #ff399e88;
  transition: .3s;
}

button:hover {
  transform: scale(1.08);
  box-shadow: 0 0 30px #ff399e;
}

.heart {
  position: fixed;
  bottom: -30px;
  color: #ff75bb;
  animation: floatUp linear forwards;
  pointer-events: none;
}

@keyframes grow {
  to { height: 190px; }
}

@keyframes bloom {
  to { transform: translateX(-50%) scale(1); }
}

@keyframes leafIn {
  to { opacity: 1; }
}

@keyframes appear {
  to { opacity: 1; }
}

@keyframes glow {
  from { text-shadow: 0 0 8px #ff36a6; }
  to { text-shadow: 0 0 25px #ff36a6, 0 0 40px #a644ff; }
}

@keyframes floatUp {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<h1>🌸 Happy Vietnamese Women's Day 🌸</h1>
<p class="subtitle">20 tháng 10 — Ngày của yêu thương</p>

<div class="garden">
  <div class="flower">
    <div class="stem"></div>
    <div class="leaf left"></div>
    <div class="leaf right"></div>

    <div class="bloom">
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="center"></div>
    </div>
  </div>
</div>

<div class="message">
  <h2>💖 Chúc mừng ngày 20/10 💖</h2>
  <p>
    Chúc bạn luôn xinh tươi như hoa 🌷<br>
    Hạnh phúc, vui vẻ và luôn rạng rỡ!<br>
    Mong mọi điều tốt đẹp nhất<br>
    sẽ đến với bạn mỗi ngày. ✨
  </p>
  <button onclick="surprise()">💌 Nhận lời chúc</button>
</div>

<script>
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = ["💗", "💕", "💖", "🌸", "✨"][
    Math.floor(Math.random() * 5)
  ];

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (15 + Math.random() * 20) + "px";
  heart.style.animationDuration = (4 + Math.random() * 4) + "s";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 8000);
}

setInterval(createHeart, 350);

function surprise() {
  alert(
    "💖 Chúc bạn ngày 20/10 thật hạnh phúc!\n\n" +
    "Luôn vui vẻ, xinh tươi và gặp thật nhiều may mắn nhé! 🌷"
  );

  for (let i = 0; i < 25; i++) {
    setTimeout(createHeart, i * 100);
  }
}
</script>

</body>
</html>
