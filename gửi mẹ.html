<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Thiệp 20/10 tặng Mẹ — Hoa nở</title>
<style>
  :root{
    --bg1:#fff6f9;
    --bg2:#ffeef6;
    --card:#ffffff;
    --accent:#ff6b81;
    --text:#333;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 10% 10%, #fff8f9, transparent 20%),
               linear-gradient(180deg,var(--bg1),var(--bg2));
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }

  .container{
    width:100%;max-width:920px;padding:28px;
  }

  .card{
    background:linear-gradient(180deg, rgba(255,255,255,0.9), var(--card));
    border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,0.12);
    overflow:hidden;display:grid;grid-template-columns:1fr 420px;
    align-items:stretch;
  }

  .left{
    padding:40px 36px;
    position:relative;
  }

  h1{margin:0 0 12px;font-size:28px;color:var(--accent)}
  p.lead{margin:0 0 18px;line-height:1.5;font-size:16px;color:#444}
  .from{margin-top:18px;color:#666;font-size:14px}

  .controls{display:flex;gap:10px;margin-top:22px}
  button{
    border:0;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:600;
    background:var(--accent);color:white;
    box-shadow:0 6px 18px rgba(255,107,129,0.16);
  }
  .btn-ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}

  /* Right side: flower area */
  .right{background:linear-gradient(180deg, rgba(255,244,247,0.8), rgba(255,238,243,0.6));display:flex;align-items:center;justify-content:center;padding:18px;position:relative}
  .stage{width:100%;max-width:360px;height:360px;display:flex;align-items:center;justify-content:center;position:relative}

  /* SVG petals */
  svg{width:100%;height:100%;overflow:visible}
  .flower{transform-origin:center center}
  .petal{
    transform-origin:50% 90%;
    transform: scale(0);
    opacity:0;
    fill:var(--accent);
    filter: drop-shadow(0 8px 18px rgba(255,107,129,0.12));
  }
  .pistil{
    transform-origin:center center;
    transform: scale(0);
    opacity:0;
    fill: #ffd166;
  }

  /* bloom animation (will be triggered by adding .bloomed on .stage) */
  .stage.bloomed .petal{
    animation: petalBloom 700ms cubic-bezier(.2,.9,.2,1) forwards;
  }
  .stage.bloomed .pistil{
    animation: pistilPop 600ms cubic-bezier(.2,.9,.2,1) 600ms forwards;
  }

  /* stagger using inline style --delay */
  @keyframes petalBloom{
    0%{transform:scale(0);opacity:0}
    60%{transform:scale(1.06);opacity:1}
    100%{transform:scale(1);opacity:1}
  }
  @keyframes pistilPop{
    0%{transform:scale(0);opacity:0}
    60%{transform:scale(1.14);opacity:1}
    100%{transform:scale(1);opacity:1}
  }

  /* subtle sway after bloom */
  .stage.bloomed .flower{ animation: sway 6s ease-in-out infinite both; }
  @keyframes sway{
    0%{transform:translateY(0) rotate(-1deg)}
    50%{transform:translateY(-4px) rotate(1.2deg)}
    100%{transform:translateY(0) rotate(-1deg)}
  }

  /* floating petals (created by JS) */
  .floating-petal{
    position:fixed;pointer-events:none;width:18px;height:28px;border-radius:50% 50% 40% 40%;
    background:linear-gradient(180deg, rgba(255,150,170,0.95), rgba(255,107,129,0.85));
    transform-origin:center center;
    opacity:0.95;will-change:transform,opacity,top,left;
    z-index:30;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.08));
  }

  /* sparkle overlay */
  .sparkle{position:absolute;inset:0;pointer-events:none}
  .star{
    position:absolute;width:6px;height:6px;border-radius:50%;background:linear-gradient(180deg,#fff,#ffdede);
    opacity:0;transform:scale(0) rotate(0deg);
    box-shadow:0 0 12px rgba(255,200,200,0.6);
    will-change:transform,opacity;
  }

  /* small responsive */
  @media (max-width:900px){
    .card{grid-template-columns:1fr;gap:0}
    .right{padding:28px}
    .stage{max-width:320px;height:320px}
  }

  /* Reduced motion respect */
  @media (prefers-reduced-motion: reduce){
    .stage.bloomed .petal, .stage.bloomed .pistil, .stage.bloomed .flower{animation:none}
  }

</style>
</head>
<body>
  <div class="container">
    <div class="card" role="article" aria-label="Thiệp 20/10 tặng mẹ">
      <div class="left">
        <h1>Chúc Mẹ 20/10</h1>
        <p class="lead" id="message">Mẹ ơi, chúc mẹ luôn khỏe mạnh, luôn xinh đẹp và mỗi ngày đều tràn ngập nụ cười. Con yêu mẹ rất nhiều.</p>
        <div class="from">Thương mẹ, <strong id="sender">[Tên bạn]</strong></div>

        <div class="controls">
          <button id="bloomBtn">Bloom — Hoa nở</button>
          <button class="btn-ghost" id="editBtn">Sửa lời chúc</button>
          <button class="btn-ghost" id="printBtn">In / Lưu PDF</button>
        </div>
      </div>

      <div class="right" aria-hidden="false">
        <div class="stage" id="stage" role="img" aria-label="Hoa nở tặng mẹ">
          <!-- SVG flowers: we'll create a few flowers with staggered delays inline -->
          <svg viewBox="0 0 360 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <!-- Flower 1 (center) -->
            <g class="flower" transform="translate(180,180) scale(1)">
              <!-- petals (8 petals) -->
              <g id="flower1">
                <!-- petals generated as rotated ellipses -->
                <g style="--i:0">
                  <ellipse class="petal" rx="22" ry="44" cx="0" cy="-60" transform="rotate(0)" style="fill:#ff8aa3; --delay:0ms; animation-delay: var(--delay);" />
                </g>
                <g style="transform:rotate(45deg)">
                  <ellipse class="petal" rx="22" ry="44" cx="0" cy="-60" transform="rotate(0)" style="fill:#ff91ac; --delay:60ms; animation-delay: var(--delay);" />
                </g>
                <g style="transform:rotate(90deg)">
                  <ellipse class="petal" rx="22" ry="44" cx="0" cy="-60" transform="rotate(0)" style="fill:#ff6b81; --delay:120ms; animation-delay: var(--delay);" />
                </g>
                <g style="transform:rotate(135deg)">
                  <ellipse class="petal" rx="22" ry="44" cx="0" cy="-60" transform="rotate(0)" style="fill:#ff95b2; --delay:180ms; animation-delay: var(--delay);" />
                </g>
                <g style="transform:rotate(180deg)">
                  <ellipse class="petal" rx="22" ry="44" cx="0" cy="-60" transform="rotate(0)" style="fill:#ff8aa3; --delay:240ms; animation-delay: var(--delay);" />
                </g>
                <g style="transform:rotate(225deg)">
                  <ellipse class="petal" rx="22" ry="44" cx="0" cy="-60" transform="rotate(0)" style="fill:#ff91ac; --delay:300ms; animation-delay: var(--delay);" />
                </g>
                <g style="transform:rotate(270deg)">
                  <ellipse class="petal" rx="22" ry="44" cx="0" cy="-60" transform="rotate(0)" style="fill:#ff6b81; --delay:360ms; animation-delay: var(--delay);" />
                </g>
                <g style="transform:rotate(315deg)">
                  <ellipse class="petal" rx="22" ry="44" cx="0" cy="-60" transform="rotate(0)" style="fill:#ff95b2; --delay:420ms; animation-delay: var(--delay);" />
                </g>
              </g>
              <circle class="pistil" r="18" cx="0" cy="0" style="fill:#ffd166; --delay:600ms; animation-delay: var(--delay);"/>
            </g>

            <!-- Flower 2 (left-top) -->
            <g class="flower" transform="translate(92,110) scale(0.82)">
              <g>
                <g style="transform:rotate(0deg)"><ellipse class="petal" rx="16" ry="34" cx="0" cy="-50" style="fill:#ffd1dc; --delay:120ms; animation-delay: var(--delay);"/></g>
                <g style="transform:rotate(60deg)"><ellipse class="petal" rx="16" ry="34" cx="0" cy="-50" style="fill:#ff9fb3; --delay:200ms; animation-delay: var(--delay);"/></g>
                <g style="transform:rotate(120deg)"><ellipse class="petal" rx="16" ry="34" cx="0" cy="-50" style="fill:#ff7da3; --delay:280ms; animation-delay: var(--delay);"/></g>
                <circle class="pistil" r="10" cx="0" cy="0" style="fill:#ffd166; --delay:420ms; animation-delay: var(--delay);"/>
              </g>
            </g>

            <!-- Flower 3 (right-top) -->
            <g class="flower" transform="translate(270,100) scale(0.76)">
              <g>
                <g style="transform:rotate(0deg)"><ellipse class="petal" rx="14" ry="30" cx="0" cy="-44" style="fill:#ffb0c3; --delay:240ms; animation-delay: var(--delay);"/></g>
                <g style="transform:rotate(50deg)"><ellipse class="petal" rx="14" ry="30" cx="0" cy="-44" style="fill:#ff8aa3; --delay:320ms; animation-delay: var(--delay);"/></g>
                <g style="transform:rotate(100deg)"><ellipse class="petal" rx="14" ry="30" cx="0" cy="-44" style="fill:#ff6b81; --delay:400ms; animation-delay: var(--delay);"/></g>
                <circle class="pistil" r="9" cx="0" cy="0" style="fill:#ffd166; --delay:540ms; animation-delay: var(--delay);"/>
              </g>
            </g>

            <!-- Flower 4 (left-bottom) -->
            <g class="flower" transform="translate(80,250) scale(0.7)">
              <g>
                <g style="transform:rotate(0deg)"><ellipse class="petal" rx="12" ry="26" cx="0" cy="-38" style="fill:#ffd6e0; --delay:320ms; animation-delay: var(--delay);"/></g>
                <g style="transform:rotate(80deg)"><ellipse class="petal" rx="12" ry="26" cx="0" cy="-38" style="fill:#ff9fb3; --delay:400ms; animation-delay: var(--delay);"/></g>
                <circle class="pistil" r="8" cx="0" cy="0" style="fill:#ffd166; --delay:620ms; animation-delay: var(--delay);"/>
              </g>
            </g>

            <!-- Flower 5 (right-bottom) -->
            <g class="flower" transform="translate(280,250) scale(0.8)">
              <g>
                <g style="transform:rotate(0deg)"><ellipse class="petal" rx="15" ry="32" cx="0" cy="-42" style="fill:#ffb7c8; --delay:360ms; animation-delay: var(--delay);"/></g>
                <g style="transform:rotate(70deg)"><ellipse class="petal" rx="15" ry="32" cx="0" cy="-42" style="fill:#ff91ac; --delay:440ms; animation-delay: var(--delay);"/></g>
                <circle class="pistil" r="9" cx="0" cy="0" style="fill:#ffd166; --delay:680ms; animation-delay: var(--delay);"/>
              </g>
            </g>

          </svg>

          <div class="sparkle" id="sparkle"></div>
        </div>
      </div>
    </div>
  </div>

<script>
  // Utility: create sparkles
  const sparkleRoot = document.getElementById('sparkle');

  function spawnSparkles(count=12){
    for(let i=0;i<count;i++){
      const s = document.createElement('div');
      s.className='star';
      const x = 30 + Math.random()*300;
      const y = 30 + Math.random()*300;
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      sparkleRoot.appendChild(s);
      const delay = Math.random()*800;
      const dur = 900 + Math.random()*700;
      s.animate([
        {transform:'scale(0) rotate(0deg)', opacity:0, offset:0},
        {transform:'scale(1.1) rotate(45deg)', opacity:1, offset:0.5},
        {transform:'scale(0.6) rotate(90deg)', opacity:0, offset:1}
      ], {duration:dur, delay:delay, easing:'cubic-bezier(.2,.9,.2,1)'});
      setTimeout(()=>s.remove(), dur+delay+50);
    }
  }

  // Floating petals generator
  const colors = ['#ff7aa3','#ff9fb3','#ffd1dc','#ff6b81','#ffb7c8'];
  function createFloatingPetal(){
    const el = document.createElement('div');
    el.className = 'floating-petal';
    const size = 10 + Math.random()*28;
    el.style.width = size + 'px';
    el.style.height = Math.round(size*1.5) + 'px';
    el.style.left = Math.random()*100 + 'vw';
    el.style.top = (-10 - Math.random()*10) + 'vh';
    const c = colors[Math.floor(Math.random()*colors.length)];
    el.style.background = `linear-gradient(180deg, ${c}, rgba(255,107,129,0.85))`;
    el.style.opacity = 0.95 - Math.random()*0.5;
    el.style.transform = 'rotate(' + (Math.random()*360) + 'deg)';
    document.body.appendChild(el);

    const duration = 4000 + Math.random()*7000;
    const endX = (Math.random()-0.5)*60; // drift
    const keyframes = [
      { transform: `translate3d(0,0,0) rotate(${Math.random()*60-30}deg)`, opacity:1 },
      { transform: `translate3d(${endX}vw, 100vh, 0) rotate(${Math.random()*360}deg)`, opacity:0.0 }
    ];
    el.animate(keyframes, { duration: duration, easing:'linear', iterations:1, delay: Math.random()*300 });
    setTimeout(()=>el.remove(), duration + 200);
  }

  // Kick off a few petals periodically
  let petalInterval;
  function startPetals(){
    if(petalInterval) return;
    petalInterval = setInterval(()=> {
      createFloatingPetal();
    }, 350 + Math.random()*400);
  }
  function stopPetals(){
    clearInterval(petalInterval); petalInterval = null;
  }

  // Bloom control: add class to stage and stagger inline delays to CSS animation
  const stage = document.getElementById('stage');
  const bloomBtn = document.getElementById('bloomBtn');
  const editBtn = document.getElementById('editBtn');
  const printBtn = document.getElementById('printBtn');

  function triggerBloom(){
    // reset: remove and re-add to replay
    stage.classList.remove('bloomed');
    // assign computed delay values from each element's style or default if missing
    // We set animation-delay from inline style --delay to each petal/pistil
    const petals = stage.querySelectorAll('.petal, .pistil');
    petals.forEach((p, idx) => {
      // If element had a style --delay, keep, else compute from index
      let d = p.style.getPropertyValue('--delay') || (idx*60 + Math.random()*80 + 'ms');
      p.style.animationDelay = d.trim();
    });
    // small timeout to allow reflow, then bloom
    requestAnimationFrame(()=> {
      requestAnimationFrame(()=> {
        stage.classList.add('bloomed');
        spawnSparkles(14);
      });
    });
    // start petals and more sparkles
    startPetals();
    // stop petals after some time to avoid too many
    setTimeout(()=> stopPetals(), 9000);
  }

  bloomBtn.addEventListener('click', ()=> { triggerBloom(); });

  // Edit message
  editBtn.addEventListener('click', ()=>{
    const msg = prompt('Chỉnh sửa lời chúc:', document.getElementById('message').textContent);
    if(msg!==null) document.getElementById('message').textContent = msg;
    const name = prompt('Gõ tên người gửi:', document.getElementById('sender').textContent);
    if(name!==null) document.getElementById('sender').textContent = name;
  });

  printBtn.addEventListener('click', ()=> window.print());

  // Auto-bloom once after load
  window.addEventListener('load', ()=>{
    setTimeout(()=> triggerBloom(), 700);
    // occasional sparkles
    setInterval(()=> spawnSparkles(6 + Math.floor(Math.random()*6)), 2500 + Math.random()*2500);
  });

  // Accessibility: allow keyboard "b" to retrigger bloom
  window.addEventListener('keydown', (e)=>{
    if(e.key === 'b' || e.key === 'B') triggerBloom();
  });

  // Small touch: clicking the stage produces a quick burst of petals
  stage.addEventListener('click', (e)=>{
    for(let i=0;i<6;i++) createFloatingPetal();
    spawnSparkles(8);
  });
</script>
</body>
</html>
